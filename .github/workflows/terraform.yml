name: Terraform CI

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment directory under environments'
        required: true
        default: dev
      action:
        description: 'Terraform action to execute'
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply
          - destroy

jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: '1.8.0'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: us-east-1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Checkov
        run: python -m pip install --upgrade pip checkov

      - name: Terraform fmt check
        run: terraform fmt -check
        working-directory: environments/${{ github.event.inputs.environment }}

      - name: Terraform init
        run: terraform init -input=false
        working-directory: environments/${{ github.event.inputs.environment }}

      - name: Terraform validate
        run: terraform validate
        working-directory: environments/${{ github.event.inputs.environment }}

      - name: Run Checkov security scan
        run: |
          mkdir -p checkov-reports
          checkov -d environments/${{ github.event.inputs.environment }} -o json --quiet > checkov-reports/checkov.json || true
          python - <<'PY'
          import json, sys
          report = json.load(open('checkov-reports/checkov.json'))
          failed = report.get('results', {}).get('failed_checks', [])
          high_critical = [c for c in failed if c.get('severity') in ('HIGH', 'CRITICAL')]
          if high_critical:
              print('High/Critical Checkov issues found:')
              for c in high_critical:
                  print(f"{c.get('id')} {c.get('severity')} {c.get('file_path')}:{c.get('file_line_range')}")
              sys.exit(1)
          print('No high/critical Checkov issues detected.')
          PY
        working-directory: .

      - name: Terraform plan
        run: terraform plan -out=tfplan
        working-directory: environments/${{ github.event.inputs.environment }}

      - name: Terraform apply
        if: ${{ github.event.inputs.action == 'apply' }}
        run: terraform apply -auto-approve tfplan
        working-directory: environments/${{ github.event.inputs.environment }}

      - name: Terraform destroy
        if: ${{ github.event.inputs.action == 'destroy' }}
        run: terraform destroy -auto-approve
        working-directory: environments/${{ github.event.inputs.environment }}
